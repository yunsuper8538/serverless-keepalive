name: Daily Server Wakeup

# ⚠️ 메인 트리거는 cron-job.org → workflow_dispatch (README 참고).
# 아래 schedule cron은 "백업 안전망"용. private repo + 활동 적은 repo에서는
# GitHub Actions schedule cron이 30~50% skip되는 알려진 이슈가 있어서
# 신뢰할 수 없음. 그래서 외부 cron(cron-job.org)이 메인이고, 이건 보조.
#
# 기본값: UTC 00:07 = KST 09:07 (정시 부하 회피용 7분 오프셋)
# 자기 시간대에 맞게 UTC cron 수정 (https://crontab.guru 참고)
on:
  schedule:
    - cron: "7 0 * * *"  # backup trigger only — main is cron-job.org
  workflow_dispatch:  # cron-job.org 및 수동 실행이 사용하는 메인 트리거

jobs:
  wakeup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Node.js 20 deprecated → Node 24로 강제 (2026-06-02 자동 마이그 대비)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install --quiet requests

      - name: Run wakeup script
        env:
          # 필수 (5개)
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_USER_ID:     ${{ secrets.SUPABASE_USER_ID }}
          NOTION_TOKEN:         ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID:   ${{ secrets.NOTION_DATABASE_ID }}
          WAKE_URL:             ${{ secrets.WAKE_URL }}

          # 선택 (default 값과 다르면 등록)
          # SUPABASE_TABLE:           ${{ secrets.SUPABASE_TABLE }}            # default: chat_messages
          # SUPABASE_PROFILE_TABLE:   ${{ secrets.SUPABASE_PROFILE_TABLE }}    # default: profiles
          # SUPABASE_PROFILE_NAME_COL:${{ secrets.SUPABASE_PROFILE_NAME_COL }} # default: nickname
          # SUPABASE_SENDER_COL:      ${{ secrets.SUPABASE_SENDER_COL }}       # default: sender_name
          # SUPABASE_CONTENT_COL:     ${{ secrets.SUPABASE_CONTENT_COL }}      # default: content
          # SUPABASE_USER_COL:        ${{ secrets.SUPABASE_USER_COL }}         # default: user_id
          # TZ_OFFSET_HOURS:          ${{ secrets.TZ_OFFSET_HOURS }}           # default: 9 (KST)
          # WAKE_TIMEOUT:             ${{ secrets.WAKE_TIMEOUT }}              # default: 150
        run: python wakeup.py
